  - authentication
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: driver-login-identifier
    timeout: 30000
- assertVisible:
    id: driver-login-password
- assertVisible:
    id: driver-login-submit
- assertVisible: 'Ny sjåfør.*invitasjonen fra løyvehaveren.*'
- assertNotVisible: Fortsett med Google
- assertNotVisible: Fortsett med Apple
- assertNotVisible: Opprett konto
- takeScreenshot: driver-invitation-only
