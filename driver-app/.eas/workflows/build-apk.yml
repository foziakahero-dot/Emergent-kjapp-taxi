name: KJAPP Driver Android APK

# Builds are started deliberately from the Driver project after source and Firebase checks.
on:
  push:
    branches:
      - __disabled_driver_apk_auto_push__

jobs:
  build_driver_android_apk:
    name: Build KJAPP Driver Android APK
    type: build
    params:
      platform: android
      profile: apk
