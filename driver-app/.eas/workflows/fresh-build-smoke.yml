name: KJAPP Driver Fresh APK + Runtime Smoke

on:
  push:
    branches: ['diagnostic/fresh-customer-driver-builds']

jobs:
  build_driver_android:
    name: Fresh KJAPP Driver Android APK
    type: build
    params:
      platform: android
      profile: apk

  driver_runtime_smoke:
    name: Cold-launch fresh KJAPP Driver APK
    needs: [build_driver_android]
    type: maestro
    runs_on: linux-large-nested-virtualization
    params:
      build_id: ${{ needs.build_driver_android.outputs.build_id }}
      flow_path: ['.maestro/fresh-driver-startup-smoke.yml']
      record_screen: true
      retries: 0
