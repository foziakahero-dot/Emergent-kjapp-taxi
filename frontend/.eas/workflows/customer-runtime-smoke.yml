name: KJAPP Customer Android Runtime Smoke

on:
  pull_request:
    branches: ['main']

jobs:
  get_customer_android:
    name: Get latest successful KJAPP Customer APK
    type: get-build
    params:
      platform: android
      profile: apk
      distribution: internal
      git_commit_hash: 66d85b847b4054c3eb9d118f92f6bd750fbfbc91
      wait_for_in_progress: false

  customer_runtime_smoke:
    name: Cold-launch KJAPP Customer on Android
    needs: [get_customer_android]
    type: maestro
    runs_on: linux-large-nested-virtualization
    outputs:
      app_pid: ${{ steps.capture_runtime.outputs.app_pid }}
      top_activity: ${{ steps.capture_runtime.outputs.top_activity }}
      crash_focus: ${{ steps.capture_runtime.outputs.crash_focus }}
    params:
      build_id: ${{ needs.get_customer_android.outputs.build_id }}
      flow_path: ['.maestro/customer-startup-smoke.yml']
      record_screen: true
      retries: 0
    hooks:
      after_maestro_tests:
        - id: capture_runtime
          name: Capture KJAPP runtime diagnostics
          run: |
            PID="$(adb shell pidof no.kjapp.app 2>/dev/null | tr -d '\r' || true)"
            TOP="$(adb shell dumpsys activity activities 2>/dev/null | grep -E 'mResumedActivity|topResumedActivity' | head -n 2 | tr '\n' ' ' | tr -d '\r' | cut -c1-1000 || true)"
            adb logcat -d -v threadtime > /tmp/kjapp-customer-logcat.txt 2>/dev/null || true
            FOCUS="$(grep -Ei 'FATAL EXCEPTION|AndroidRuntime|ReactNativeJS|JavascriptException|UnsatisfiedLinkError|dlopen failed|worklet|reanimated|SoLoader|Unable to load|Caused by|no.kjapp.app' /tmp/kjapp-customer-logcat.txt | tail -n 40 | tr '\n' '|' | tr -d '\r' | cut -c1-6000 || true)"
            [ -n "$PID" ] || PID="NONE"
            [ -n "$TOP" ] || TOP="NONE"
            [ -n "$FOCUS" ] || FOCUS="NO_MATCHING_FATAL_LOG_LINES"
            set-output app_pid "$PID"
            set-output top_activity "$TOP"
            set-output crash_focus "$FOCUS"

  report_runtime:
    name: Report Customer runtime diagnostics
    after: [customer_runtime_smoke]
    type: github-comment
    params:
      payload: |
        ## KJAPP Customer Android runtime smoke

        **Maestro status:** ${{ after.customer_runtime_smoke.status }}
        **App PID after test:** `${{ after.customer_runtime_smoke.outputs.app_pid }}`
        **Top activity:** `${{ after.customer_runtime_smoke.outputs.top_activity }}`

        **Focused logcat**
        ```
        ${{ after.customer_runtime_smoke.outputs.crash_focus }}
        ```

        This diagnostic tests the already-successful Customer APK from main commit `66d85b8`.
