name: KJAPP Customer Android APK

on:
  push:
    branches: ['main', 'codex/kjapp-signature-mainline']

jobs:
  build_customer_android_apk:
    name: Build KJAPP Customer Android APK
    type: build
    params:
      platform: android
      profile: apk

  probe_driver_app:
    name: Validate KJAPP Driver from Customer EAS checkout
    image: sdk-57
    runs_on: linux-large
    steps:
      - uses: eas/checkout
      - name: Verify Driver sibling checkout
        run: |
          echo "Customer project base: $(pwd)"
          echo "Repository parent:"
          ls -la ..
          test -f ../driver-app/package.json
          test -f ../driver-app/app.json
          test -f ../driver-app/eas.json
          echo "Driver sibling checkout is available"
      - name: Install Driver dependencies
        run: cd ../driver-app && npm install
      - name: Validate Driver Expo config
        run: cd ../driver-app && npx expo config --type public
      - name: Type-check Driver app
        run: cd ../driver-app && npx tsc --noEmit
