name: KJAPP Android APKs

on:
  push:
    branches: ['main']

jobs:
  build_customer_android_apk:
    name: Build KJAPP Customer Android APK
    type: build
    params:
      platform: android
      profile: apk

  build_driver_android_apk:
    name: Build KJAPP Driver Android APK
    image: sdk-57
    env:
      CI: '1'
      EXPO_PUBLIC_BACKEND_URL: https://github-app-builder-28.emergent.host
    outputs:
      result: ${{ steps.driver_pipeline.outputs.result }}
      stage: ${{ steps.driver_pipeline.outputs.stage }}
      code: ${{ steps.driver_pipeline.outputs.code }}
    steps:
      - uses: eas/checkout

      - id: driver_pipeline
        name: Compile Driver APK with failure capture
        run: |
          set -u
          rm -rf .driver-build driver-artifacts
          mkdir -p driver-artifacts

          fail() {
            stage="$1"
            code="$2"
            set-output result "failure"
            set-output stage "$stage"
            set-output code "$code"
            exit 0
          }

          cp -R ../driver-app .driver-build > /tmp/driver-stage.log 2>&1 || fail "stage-workspace" "workspace"

          cd .driver-build
          npm install --no-audit --no-fund > /tmp/driver-install.log 2>&1 || fail "npm-install" "npm-install"
          npx expo config --type public > /tmp/driver-config.log 2>&1 || fail "expo-config" "expo-config"
          npx expo prebuild --platform android --clean > /tmp/driver-prebuild.log 2>&1 || fail "expo-prebuild" "expo-prebuild"

          cd android
          test -n "${ANDROID_HOME:-}" || fail "android-env" "android-env"
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace --info > /tmp/driver-gradle.log 2>&1
          GRADLE_EXIT=$?
          if [ $GRADLE_EXIT -ne 0 ]; then
            if grep -Eqi 'expo-task-manager|TaskManager' /tmp/driver-gradle.log; then fail "gradle-assembleRelease" "task-manager"; fi
            if grep -Eqi 'expo-location|LocationModule|LocationTask' /tmp/driver-gradle.log; then fail "gradle-assembleRelease" "location"; fi
            if grep -Eqi 'expo-notifications|Notifications' /tmp/driver-gradle.log; then fail "gradle-assembleRelease" "notifications"; fi
            if grep -Eqi 'Unable to resolve module|Cannot find module' /tmp/driver-gradle.log; then fail "gradle-assembleRelease" "metro-resolve"; fi
            if grep -Eqi 'bundleReleaseJsAndAssets|createBundleReleaseJsAndAssets|SyntaxError|BABEL_TRANSFORM_ERROR' /tmp/driver-gradle.log; then fail "gradle-assembleRelease" "js-bundle"; fi
            if grep -Eqi 'Manifest merger failed|processReleaseMainManifest' /tmp/driver-gradle.log; then fail "gradle-assembleRelease" "manifest"; fi
            if grep -Eqi 'Android resource linking failed|AAPT|processReleaseResources' /tmp/driver-gradle.log; then fail "gradle-assembleRelease" "resources"; fi
            if grep -Eqi 'compileReleaseKotlin|Kotlin' /tmp/driver-gradle.log; then fail "gradle-assembleRelease" "kotlin"; fi
            if grep -Eqi 'compileReleaseJavaWithJavac|javac' /tmp/driver-gradle.log; then fail "gradle-assembleRelease" "java"; fi
            if grep -Eqi 'Duplicate class' /tmp/driver-gradle.log; then fail "gradle-assembleRelease" "duplicate-class"; fi
            if grep -Eqi 'Could not resolve|Could not find' /tmp/driver-gradle.log; then fail "gradle-assembleRelease" "dependency-resolution"; fi
            if grep -Eqi 'react-native-reanimated|react-native-worklets|reanimated|worklets' /tmp/driver-gradle.log; then fail "gradle-assembleRelease" "reanimated-worklets"; fi
            if grep -Eqi 'CMake|ninja|NDK' /tmp/driver-gradle.log; then fail "gradle-assembleRelease" "cmake-ndk"; fi
            if grep -Eqi 'OutOfMemory|Java heap space' /tmp/driver-gradle.log; then fail "gradle-assembleRelease" "oom"; fi
            if grep -Eqi 'signing|keystore' /tmp/driver-gradle.log; then fail "gradle-assembleRelease" "signing"; fi
            fail "gradle-assembleRelease" "gradle-unknown"
          fi

          cd ../..
          test -f .driver-build/android/app/build/outputs/apk/release/app-release.apk || fail "apk-output" "apk-output"
          cp .driver-build/android/app/build/outputs/apk/release/app-release.apk driver-artifacts/KJAPP-Driver.apk
          set-output result "success"
          set-output stage "complete"
          set-output code "success"

      - uses: eas/upload_artifact
        if: ${{ steps.driver_pipeline.outputs.result == 'success' }}
        with:
          type: other
          name: kjapp-driver-apk
          path: driver-artifacts/KJAPP-Driver.apk
          ignore_error: true

  driver_compile_success:
    name: DRIVER APK COMPILE SUCCESS
    needs: [build_driver_android_apk]
    if: ${{ needs.build_driver_android_apk.outputs.code == 'success' }}
    steps:
      - run: echo "KJAPP Driver APK compiled successfully."

  driver_error_workspace:
    name: DRIVER ERROR - workspace staging
    needs: [build_driver_android_apk]
    if: ${{ needs.build_driver_android_apk.outputs.code == 'workspace' }}
    steps:
      - run: exit 1

  driver_error_npm:
    name: DRIVER ERROR - npm install
    needs: [build_driver_android_apk]
    if: ${{ needs.build_driver_android_apk.outputs.code == 'npm-install' }}
    steps:
      - run: exit 1

  driver_error_expo_config:
    name: DRIVER ERROR - Expo config
    needs: [build_driver_android_apk]
    if: ${{ needs.build_driver_android_apk.outputs.code == 'expo-config' }}
    steps:
      - run: exit 1

  driver_error_expo_prebuild:
    name: DRIVER ERROR - Expo prebuild
    needs: [build_driver_android_apk]
    if: ${{ needs.build_driver_android_apk.outputs.code == 'expo-prebuild' }}
    steps:
      - run: exit 1

  driver_error_android_env:
    name: DRIVER ERROR - Android environment
    needs: [build_driver_android_apk]
    if: ${{ needs.build_driver_android_apk.outputs.code == 'android-env' }}
    steps:
      - run: exit 1

  driver_error_task_manager:
    name: DRIVER ERROR - expo-task-manager native build
    needs: [build_driver_android_apk]
    if: ${{ needs.build_driver_android_apk.outputs.code == 'task-manager' }}
    steps:
      - run: exit 1

  driver_error_location:
    name: DRIVER ERROR - expo-location native build
    needs: [build_driver_android_apk]
    if: ${{ needs.build_driver_android_apk.outputs.code == 'location' }}
    steps:
      - run: exit 1

  driver_error_notifications:
    name: DRIVER ERROR - expo-notifications native build
    needs: [build_driver_android_apk]
    if: ${{ needs.build_driver_android_apk.outputs.code == 'notifications' }}
    steps:
      - run: exit 1

  driver_error_metro:
    name: DRIVER ERROR - Metro module resolution
    needs: [build_driver_android_apk]
    if: ${{ needs.build_driver_android_apk.outputs.code == 'metro-resolve' }}
    steps:
      - run: exit 1

  driver_error_js_bundle:
    name: DRIVER ERROR - JavaScript release bundle
    needs: [build_driver_android_apk]
    if: ${{ needs.build_driver_android_apk.outputs.code == 'js-bundle' }}
    steps:
      - run: exit 1

  driver_error_manifest:
    name: DRIVER ERROR - Android manifest merge
    needs: [build_driver_android_apk]
    if: ${{ needs.build_driver_android_apk.outputs.code == 'manifest' }}
    steps:
      - run: exit 1

  driver_error_resources:
    name: DRIVER ERROR - Android resources
    needs: [build_driver_android_apk]
    if: ${{ needs.build_driver_android_apk.outputs.code == 'resources' }}
    steps:
      - run: exit 1

  driver_error_kotlin:
    name: DRIVER ERROR - Kotlin compilation
    needs: [build_driver_android_apk]
    if: ${{ needs.build_driver_android_apk.outputs.code == 'kotlin' }}
    steps:
      - run: exit 1

  driver_error_java:
    name: DRIVER ERROR - Java compilation
    needs: [build_driver_android_apk]
    if: ${{ needs.build_driver_android_apk.outputs.code == 'java' }}
    steps:
      - run: exit 1

  driver_error_duplicate_class:
    name: DRIVER ERROR - duplicate Android class
    needs: [build_driver_android_apk]
    if: ${{ needs.build_driver_android_apk.outputs.code == 'duplicate-class' }}
    steps:
      - run: exit 1

  driver_error_dependency:
    name: DRIVER ERROR - Gradle dependency resolution
    needs: [build_driver_android_apk]
    if: ${{ needs.build_driver_android_apk.outputs.code == 'dependency-resolution' }}
    steps:
      - run: exit 1

  driver_error_worklets:
    name: DRIVER ERROR - Reanimated Worklets native build
    needs: [build_driver_android_apk]
    if: ${{ needs.build_driver_android_apk.outputs.code == 'reanimated-worklets' }}
    steps:
      - run: exit 1

  driver_error_cmake:
    name: DRIVER ERROR - CMake NDK native build
    needs: [build_driver_android_apk]
    if: ${{ needs.build_driver_android_apk.outputs.code == 'cmake-ndk' }}
    steps:
      - run: exit 1

  driver_error_oom:
    name: DRIVER ERROR - Gradle memory
    needs: [build_driver_android_apk]
    if: ${{ needs.build_driver_android_apk.outputs.code == 'oom' }}
    steps:
      - run: exit 1

  driver_error_signing:
    name: DRIVER ERROR - Android signing
    needs: [build_driver_android_apk]
    if: ${{ needs.build_driver_android_apk.outputs.code == 'signing' }}
    steps:
      - run: exit 1

  driver_error_apk_output:
    name: DRIVER ERROR - APK output missing
    needs: [build_driver_android_apk]
    if: ${{ needs.build_driver_android_apk.outputs.code == 'apk-output' }}
    steps:
      - run: exit 1

  driver_error_unknown:
    name: DRIVER ERROR - unknown Gradle failure
    needs: [build_driver_android_apk]
    if: ${{ needs.build_driver_android_apk.outputs.code == 'gradle-unknown' }}
    steps:
      - run: exit 1
