name: SNAR Customer QA TestFlight upload only
# Upload the verified QA IPA only; no recompilation or App Store release.
on:
  workflow_dispatch: {}
jobs:
  upload_verified_qa_ipa:
    name: Upload Customer QA build to TestFlight
    type: testflight
    environment: preview
    params:
      build_id: 5ffa39d2-8398-493f-b914-d5bdf4e8bd28
      profile: testflight-qa
      submit_beta_review: false
      changelog: |
        SNAR Customer QA, isolated QA backend. Source afd2bfaf5a5afe6f706a4ed3488a19fdc759cf6a.
        Test registration and consent, Google and Apple sign-in, maps and trip status.
        QA test data and Stripe test payments only. Physical end-to-end verification is pending.
