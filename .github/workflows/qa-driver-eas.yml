name: SNAR QA Driver EAS APK - manual locked

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Exact reviewed QA commit SHA to build"
        required: true
        type: string

permissions:
  contents: read

jobs:
  driver:
    uses: ./.github/workflows/qa-android-eas.yml
    with:
      app_directory: driver-app
      expected_sha: ${{ inputs.expected_sha }}
      authorization: BUILD_QA_APK
    secrets: inherit
