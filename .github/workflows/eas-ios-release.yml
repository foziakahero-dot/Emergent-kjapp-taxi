name: KJAPP signed iOS EAS build

on:
  workflow_dispatch:
    inputs:
      target:
        description: App to build
        required: true
        default: customer
        type: choice
        options:
          - customer
          - driver
          - all

permissions:
  contents: read

concurrency:
  group: kjapp-eas-ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  customer-ios:
    name: Customer signed iOS build
    if: ${{ inputs.target == 'customer' || inputs.target == 'all' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: frontend
    env:
      CI: '1'
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_BACKEND_URL: https://github-app-builder-28.emergent.host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require Expo token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "Missing GitHub secret EXPO_TOKEN"
            exit 1
          fi
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx expo config --type public
      - run: npx eas-cli@latest build --platform ios --profile production --non-interactive --wait

  driver-ios:
    name: Driver signed iOS build
    if: ${{ inputs.target == 'driver' || inputs.target == 'all' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: driver-app
    env:
      CI: '1'
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_BACKEND_URL: https://github-app-builder-28.emergent.host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require Expo token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "Missing GitHub secret EXPO_TOKEN"
            exit 1
          fi
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx expo config --type public
      - run: npx eas-cli@latest build --platform ios --profile production --non-interactive --wait
