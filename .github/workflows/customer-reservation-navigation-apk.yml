name: SNAR customer reservations and navigation APK

on:
  push:
    branches: [fix/customer-search-mapbox-stripe-20261004]
    paths: [.github/workflows/customer-reservation-navigation-apk.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snar-customer-reservation-apk
  cancel-in-progress: false

jobs:
  customer-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: frontend
    env:
      CI: '1'
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_BACKEND_URL: https://api.kjappapp.no
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require existing Expo credentials
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "Missing GitHub secret EXPO_TOKEN"
            exit 1
          fi
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: node scripts/customer-build-gate.cjs
      - run: npx eas-cli@latest build --platform android --profile apk --non-interactive --wait

