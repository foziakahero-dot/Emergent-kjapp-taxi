name: KJAPP Beta Gate

on:
  workflow_dispatch:
  push:
    branches:
      - beta/oslo-production-ready
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'driver-app/**'
      - 'admin-web/**'
      - 'marketing-web/**'
      - '.github/workflows/beta-gate.yml'
  pull_request:
    branches:
      - main
      - beta/oslo-production-ready
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'driver-app/**'
      - 'admin-web/**'
      - 'marketing-web/**'
      - '.github/workflows/beta-gate.yml'

permissions:
  contents: read

concurrency:
  group: kjapp-beta-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-syntax:
    name: Backend syntax + focused regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-ci.txt
      - name: Install portable backend test dependencies
        run: python -m pip install -r backend/requirements-ci.txt
      - name: Compile backend Python
        run: python -m compileall -q backend
      - name: Run static beta release policy
        run: python scripts/beta_static_policy.py
      - name: Run beta security + ride-integrity regressions
        run: >-
          python -m pytest -q
          backend/tests/test_security_regressions_unit.py
          backend/tests/test_receipt_identity_recheck_contract.py
          backend/tests/test_real_trip_integrity_contract.py
          backend/tests/test_beta_trip_integrity_contract.py
          backend/tests/test_beta_trip_lifecycle_contract.py
          backend/tests/test_mobile_server_truth_contract.py

  admin-web:
    name: Admin web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-web/package-lock.json
      - run: npm ci
      - run: npm run build

  marketing-web:
    name: Marketing web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: marketing-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: marketing-web/package-lock.json
      - run: npm ci
      - run: npm run build

  customer-app:
    name: Customer typecheck + Expo config
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx expo-doctor@latest
      - run: npx expo config --type public

  driver-app:
    name: Driver typecheck + Expo config
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: driver-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx expo-doctor@latest
      - run: npx expo config --type public
