name: SNAR QA mobile regression

on:
  push:
    branches: [qa/mobile-preflight-maestro-20261105]
    paths: ['frontend/**', 'driver-app/**', 'scripts/**', 'qa/mobile-beta/**', '.github/workflows/qa-mobile-regression.yml']
  pull_request:
    branches: [qa/mobile-preflight-maestro-20261105]
    paths: ['frontend/**', 'driver-app/**', 'scripts/**', 'qa/mobile-beta/**', '.github/workflows/qa-mobile-regression.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            driver-app/package-lock.json
      - name: Install the reviewed dependency locks without native build hooks
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix frontend
          npm ci --ignore-scripts --no-audit --no-fund --prefix driver-app
      - name: Check both app types and behaviour contracts
        run: |
          frontend/node_modules/.bin/tsc --project frontend/tsconfig.json --noEmit
          driver-app/node_modules/.bin/tsc --project driver-app/tsconfig.json --noEmit
          node --test scripts/*.test.cjs
          node --test driver-app/tests/*.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test QA runner isolation and artifact guards
        run: python -m unittest discover -s qa/mobile-beta -p 'test_*.py'

  native_customer:
    # Enable after account billing, Expo preview secrets and synthetic fixtures
    # are configured. A skipped job is NOT a mobile E2E pass.
    if: github.event_name == 'push' && vars.SNAR_QA_NATIVE_CI == 'true'
    needs: regression
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        working-directory: frontend
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build this exact QA commit and test its resulting APK
        run: npx --yes eas-cli@27.10.0 workflow:run qa-beta-customer.yml --ref "$GITHUB_SHA" --input "expected_source_sha=$GITHUB_SHA" --wait --non-interactive
