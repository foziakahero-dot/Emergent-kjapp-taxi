name: KJAPP GOLD Rebase Check

on:
  push:
    branches:
      - kjapp-gold-rebase
  workflow_dispatch:

permissions:
  contents: read

jobs:
  customer-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx tsc --noEmit
      - run: npx expo config --type public

  driver-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: driver-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx tsc --noEmit
      - run: npx expo config --type public
