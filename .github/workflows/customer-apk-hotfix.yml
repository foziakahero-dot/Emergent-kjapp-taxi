name: KJAPP Customer Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/customer-apk-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kjapp-customer-apk-main
  cancel-in-progress: true

env:
  CI: '1'
  EXPO_PUBLIC_BACKEND_URL: https://kjapp-beta-api.onrender.com

jobs:
  customer-apk:
    name: Build KJAPP Customer APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Expo config
        run: npx expo config --type public

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean

      - name: Build release APK
        working-directory: frontend/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload Customer APK
        uses: actions/upload-artifact@v4
        with:
          name: KJAPP-Customer-Android-APK-hotfix
          path: frontend/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
