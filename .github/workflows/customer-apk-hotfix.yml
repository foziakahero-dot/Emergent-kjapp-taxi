name: SNAR Customer QA APK - locked EAS signing

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full reviewed QA commit already deployed on Render
        type: string
        required: true
      authorization:
        description: Enter BUILD_QA_APK after approving this release
        type: string
        required: true

permissions:
  contents: read

jobs:
  apk:
    uses: ./.github/workflows/qa-android-eas.yml
    with:
      app_directory: frontend
      expected_sha: ${{ inputs.expected_sha }}
      authorization: ${{ inputs.authorization }}
    secrets:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
