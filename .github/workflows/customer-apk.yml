name: SNAR Customer Preflight - manual, no APK

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Customer branch/ref to validate"
        required: true
        default: "fix/customer-search-mapbox-stripe-20261004"
        type: string
      expected_sha:
        description: "Exact Customer commit SHA expected"
        required: true
        default: "a7bd5261da2cf5d54d7a759e3c1da82028df5927"
        type: string

permissions:
  contents: read
  statuses: write

concurrency:
  group: snar-customer-preflight
  cancel-in-progress: true

jobs:
  preflight:
    name: Validate Customer source without building APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "1"
      EXPO_PUBLIC_BACKEND_URL: "https://api.kjappapp.no"
    steps:
      - name: Checkout exact Customer ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1

      - name: Verify exact source SHA
        id: source
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "sha=$ACTUAL_SHA" >> "$GITHUB_OUTPUT"
          echo "Customer source SHA: $ACTUAL_SHA"
          if [ "$ACTUAL_SHA" != "${{ inputs.expected_sha }}" ]; then
            echo "Ref resolved to $ACTUAL_SHA but expected ${{ inputs.expected_sha }}"
            exit 1
          fi

      - name: Mark preflight pending
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" \
            -f state=pending \
            -f context='snar/customer-preflight' \
            -f description='Customer preflight running'

      - name: Verify live-car and vehicle artwork source is present
        shell: bash
        run: |
          set -euo pipefail
          test -f frontend/src/components/VehicleAsset.tsx
          test -f frontend/src/components/CarMarker.tsx
          grep -q 'cars/nearby' frontend/src/components/InteractiveMap.native.tsx
          grep -q 'cars/nearby' frontend/src/components/InteractiveMapFallback.tsx

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Customer dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: TypeScript
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Validate Expo config
        working-directory: frontend
        run: npx expo config --type public

      - name: Metro Android export
        working-directory: frontend
        run: npx expo export --platform android --output-dir /tmp/snar-customer-export

      - name: Generate Android project only - no native build
        working-directory: frontend
        run: npx expo prebuild --platform android --clean

      - name: Record preflight result on exact Customer SHA
        if: always() && steps.source.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.source.outputs.sha }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            STATE=success
            DESC='Customer preflight passed - APK may be built manually'
          else
            STATE=failure
            DESC='Customer preflight failed - do not build APK'
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" \
            -f state="$STATE" \
            -f context='snar/customer-preflight' \
            -f description="$DESC"
