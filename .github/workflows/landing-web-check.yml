name: Landing web check

on:
  pull_request:
    paths:
      - 'marketing-web/**'
      - '.github/workflows/landing-web-check.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: marketing-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: marketing-web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
