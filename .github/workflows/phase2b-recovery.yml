name: SNAR Phase 2B Recovery

on:
  push:
    branches:
      - recovery/snar-mobile-v10-phase2b

permissions:
  contents: write

jobs:
  recover-server:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch locked backend history
        run: git fetch origin fix/beta-mobile-firebase-ops-20260926

      - name: Recover and hash-verify server guards
        run: python3 scripts/recover_phase2b_server.py

      - name: Verify no whitespace damage
        run: git diff --check

      - name: Commit exact recovered server
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/server.py
          if git diff --cached --quiet; then
            echo "No server change required"
            exit 0
          fi
          git commit -m "fix(recovery): restore exact Phase 2B backend guards"
          git push origin HEAD:recovery/snar-mobile-v10-phase2b
