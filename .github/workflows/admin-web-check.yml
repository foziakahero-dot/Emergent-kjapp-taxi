name: Admin web build check

on:
  push:
    branches:
      - release/emergent-production
    paths:
      - 'admin-web/**'
      - '.github/workflows/admin-web-check.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build production admin
        env:
          VITE_API_BASE: https://example.invalid/api
        run: npm run build
