name: QA backend security regressions

on:
  pull_request:
    branches: [qa/snar-v10-phase5-staging-e2e]
    paths:
      - 'backend/**'
      - '.github/workflows/qa-security-regressions.yml'

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install the candidate runtime and offline test transport
        run: python -m pip install -r backend/requirements-render.txt pytest-socket==0.8.1
      - name: Check dependencies
        run: python -m pip check
      - name: Test the backend with synthetic data and network sockets disabled
        env:
          PYTHONPATH: backend
        run: >-
          python -m pytest -q --disable-socket --allow-unix-socket backend/tests
          --ignore-glob='*test_iter*' --ignore=backend/tests/backend_test.py
