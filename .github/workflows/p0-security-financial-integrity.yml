name: P0 security financial integrity validation

on:
  push:
    branches:
      - feature/p0-security-financial-integrity
    paths:
      - 'backend/**'
      - 'admin-web/**'
      - '.github/workflows/p0-security-financial-integrity.yml'

permissions:
  contents: read

jobs:
  backend-p0:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: kjapp_ci
      JWT_SECRET: ci-jwt-secret-for-kjapp-p0-that-is-at-least-32-characters
      APP_ENV: development
      ADMIN_EMAIL: admin-ci@example.no
      ADMIN_PASSWORD: Strong-CI-Admin-Pass-123!
      ENABLE_DEMO_DATA: 'false'
      STRIPE_API_KEY: sk_test_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_test_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt
      - name: Python compile
        run: python -m py_compile backend/server.py backend/admin_control_center.py backend/financial_integrity.py backend/tests/test_p0_security_financial_integrity.py
      - name: Focused lint
        run: |
          flake8 backend/server.py backend/admin_control_center.py backend/financial_integrity.py backend/tests/test_p0_security_financial_integrity.py --select=E9,F63,F7,F82 --show-source
          flake8 backend/financial_integrity.py backend/tests/test_p0_security_financial_integrity.py --max-line-length=140 --ignore=E402,E501,W503
      - name: P0 + existing security regression tests
        working-directory: backend
        run: pytest tests/test_p0_security_financial_integrity.py tests/test_security_regressions_unit.py -q

  admin-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-web/package-lock.json
      - name: Install
        run: npm install
      - name: Build and typecheck
        run: npm run build
