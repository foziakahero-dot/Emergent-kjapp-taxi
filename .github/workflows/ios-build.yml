name: KJAPP iOS smoke builds

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'driver-app/**'
      - '.github/workflows/ios-build.yml'

permissions:
  contents: read

concurrency:
  group: kjapp-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-smoke:
    name: ${{ matrix.label }} iOS simulator compile
    runs-on: macos-26
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: frontend
            label: Customer
          - dir: driver-app
            label: Driver
    env:
      CI: '1'
      EXPO_PUBLIC_BACKEND_URL: https://github-app-builder-28.emergent.host

    defaults:
      run:
        working-directory: ${{ matrix.dir }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install app dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Expo Doctor
        run: npx expo-doctor@latest

      - name: Validate Expo project
        run: npx expo config --type public

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        working-directory: ${{ matrix.dir }}/ios
        run: pod install

      - name: Compile unsigned simulator build
        working-directory: ${{ matrix.dir }}/ios
        run: |
          set -euo pipefail
          workspace="$(find . -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          if [ -z "$workspace" ]; then
            echo "No Xcode workspace generated"
            exit 1
          fi
          scheme="$(xcodebuild -workspace "$workspace" -list -json | python3 -c 'import json,sys; d=json.load(sys.stdin); s=d.get("workspace",{}).get("schemes",[]); print(next((x for x in s if not x.startswith("Pods-")), s[0] if s else ""))')"
          if [ -z "$scheme" ]; then
            echo "No Xcode scheme found"
            exit 1
          fi
          echo "Building workspace=$workspace scheme=$scheme"
          xcodebuild \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath "$RUNNER_TEMP/KJAPP-${{ matrix.label }}-DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build
