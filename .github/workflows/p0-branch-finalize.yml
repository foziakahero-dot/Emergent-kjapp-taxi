name: P0 branch finalizer

on:
  push:
    branches:
      - p0-beta-hardening-20260917
    paths:
      - '.github/workflows/p0-branch-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p0-beta-hardening-20260917
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Register P0 SSE routes in FastAPI
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/server.py')
          text = path.read_text()
          import_line = 'from sse_routes import install_sse_routes\n'
          if import_line not in text:
              marker = 'import requests as http_requests\n'
              if marker not in text:
                  raise SystemExit('server import marker not found')
              text = text.replace(marker, marker + '\n' + import_line, 1)

          call = '''install_sse_routes(\n    api=api,\n    get_current_user=get_current_user,\n    require_driver=require_driver,\n    active_trip=active_trip,\n    cars_nearby=cars_nearby,\n    nearby_request_cls=NearbyCarsRequest,\n    driver_pending=driver_pending,\n    driver_current=driver_current,\n)\n'''
          include_marker = 'app.include_router(api)\n'
          if call not in text:
              if include_marker not in text:
                  raise SystemExit('router include marker not found')
              text = text.replace(include_marker, call + '\n' + include_marker, 1)
          path.write_text(text)
          PY

      - name: Validate backend syntax
        run: python -m py_compile backend/server.py backend/sse_routes.py

      - name: Refresh Customer lockfile
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Refresh Driver lockfile
        working-directory: driver-app
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit generated P0 files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/server.py frontend/package-lock.json driver-app/package-lock.json
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'P0 wire SSE routes and refresh lockfiles'
          git push origin HEAD:p0-beta-hardening-20260917
