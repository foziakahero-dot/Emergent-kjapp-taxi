name: SNAR AI backend check

on:
  push:
    branches:
      - fix/snar-openai-astra-chat-20261017
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-ai:
    name: Backend AI compile + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-ci.txt
      - name: Install backend CI dependencies
        run: python -m pip install -r backend/requirements-ci.txt
      - name: Compile backend Python
        run: python -m compileall -q backend
      - name: Run SNAR OpenAI/Astra regressions
        env:
          PYTHONPATH: backend
        run: python -m pytest -q backend/tests/test_openai_astra_adapter.py
