name: KJAPP Android APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'driver-app/**'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

concurrency:
  group: kjapp-android-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: '1'
  EXPO_PUBLIC_BACKEND_URL: https://github-app-builder-28.emergent.host

jobs:
  customer-apk:
    name: KJAPP Customer standalone APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Validate Expo config
        run: npx expo config --type public

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean

      - name: Build standalone Customer release APK
        working-directory: frontend/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload Customer APK
        uses: actions/upload-artifact@v4
        with:
          name: KJAPP-Customer-Android-APK
          path: frontend/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

  driver-apk:
    name: KJAPP Driver standalone APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: driver-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Validate Expo config
        run: npx expo config --type public

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean

      - name: Build standalone Driver release APK
        working-directory: driver-app/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload Driver APK
        uses: actions/upload-artifact@v4
        with:
          name: KJAPP-Driver-Android-APK
          path: driver-app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
