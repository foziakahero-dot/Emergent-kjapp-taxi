name: Android build (APK + AAB)

# Bygger KJAPP-appen for Android i skyen — du trenger ingen Mac eller Android Studio.
# APK-en havner under "Artifacts" på kjøringen og kan lastes rett inn på telefonen.
#
# Repository variable som MÅ settes (Settings > Secrets and variables > Actions > Variables):
#   KJAPP_API_URL              t.d. https://api.kjappapp.no
# Valgfrie secrets for SIGNERT release (Settings > Secrets > Actions):
#   ANDROID_KEYSTORE_BASE64    base64 av upload-keystore.jks  (base64 -i upload-keystore.jks | pbcopy)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# Valgfri secret for push i appen:
#   GOOGLE_SERVICES_JSON       hele innholdet i google-services.json

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Versjonsnavn (f.eks. 1.0.1)"
        required: false
        default: "1.0.0"
      version_code:
        description: "Versjonskode (heltall, må økes for hver Play-opplasting)"
        required: false
        default: "1"
  push:
    tags:
      - "v*"

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Add google-services.json (push notifications)
        if: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
        working-directory: frontend
        run: printf '%s' "${{ secrets.GOOGLE_SERVICES_JSON }}" > android/app/google-services.json

      - name: Build web bundle
        working-directory: frontend
        env:
          REACT_APP_BACKEND_URL: ${{ vars.KJAPP_API_URL }}
          GENERATE_SOURCEMAP: "false"
          CI: "false"
        run: |
          test -n "$REACT_APP_BACKEND_URL" || (echo "Sett repository variable KJAPP_API_URL" && exit 1)
          yarn build

      - name: Capacitor sync
        working-directory: frontend
        run: npx cap sync android

      - name: Decode release keystore
        id: keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/kjapp.jks"
          echo "path=$RUNNER_TEMP/kjapp.jks" >> "$GITHUB_OUTPUT"

      - name: Build release APK + AAB
        working-directory: frontend/android
        env:
          KJAPP_VERSION_NAME: ${{ github.event.inputs.version_name || '1.0.0' }}
          KJAPP_VERSION_CODE: ${{ github.event.inputs.version_code || '1' }}
          KJAPP_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          KJAPP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KJAPP_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KJAPP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kjapp-android-apk
          path: frontend/android/app/build/outputs/apk/release/*.apk

      - name: Upload Play Store bundle
        uses: actions/upload-artifact@v4
        with:
          name: kjapp-android-aab
          path: frontend/android/app/build/outputs/bundle/release/*.aab
