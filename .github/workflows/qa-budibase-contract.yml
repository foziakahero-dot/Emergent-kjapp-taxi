name: QA optional PostgreSQL admin contracts
on:
  workflow_dispatch:
  pull_request:
    paths:
      - integrations/budibase/**
      - .github/workflows/qa-budibase-contract.yml
permissions:
  contents: read
concurrency:
  group: postgres-admin-contract-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolated-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: integrations/budibase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: integrations/budibase/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: integrations/budibase/requirements*.txt
      - run: npm ci
      - run: npm test
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q tests/test_gateway.py tests/test_openapi.py tests/test_selfhost.py
      - run: python export_openapi.py
      - run: git diff --exit-code -- budibase-rest.openapi.json
