name: KJAPP Product Rebase Check

on:
  pull_request:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'driver-app/**'
      - 'fleet-web/**'
      - 'marketing-web/**'
      - '.github/workflows/product-rebase-check.yml'

permissions:
  contents: read

concurrency:
  group: kjapp-product-rebase-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CI: '1'

jobs:
  customer:
    name: Customer Expo typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx tsc --noEmit
      - run: npx expo config --type public

  driver:
    name: Driver Expo typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: driver-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx tsc --noEmit
      - run: npx expo config --type public

  fleet:
    name: Fleet web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fleet-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build

  marketing:
    name: Marketing web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: marketing-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
