name: KJAPP Product Rebase Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CI: '1'

jobs:
  customer:
    name: Customer Expo typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Validate Expo config
        run: npx expo config --type public

  driver:
    name: Driver Expo typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: driver-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Validate Expo config
        run: npx expo config --type public

  fleet:
    name: Fleet web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fleet-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install
      - name: Build
        run: npm run build

  marketing:
    name: Marketing web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: marketing-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install
      - name: Build
        run: npm run build
