name: SNAR Customer APK - authorized one-time build

on:
  push:
    branches:
      - fix/customer-search-mapbox-stripe-20261004
    paths:
      - '.github/workflows/snar-customer-apk-once.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snar-customer-apk-authorized-once
  cancel-in-progress: false

env:
  SOURCE_SHA: cb15b514f888e3d9ca09cf46524d567d56d2c8b7

jobs:
  customer-apk:
    name: Build authorized SNAR Customer EAS APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: frontend
    env:
      CI: '1'
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_BACKEND_URL: https://api.kjappapp.no
      EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN: ${{ vars.MAPBOX_PUBLIC_TOKEN }}
    steps:
      - name: Checkout exact approved Customer source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
      - name: Verify exact source SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require Expo token
        shell: bash
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "Missing GitHub secret EXPO_TOKEN"
            exit 1
          fi
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Expo config check
        run: npx expo config --type public
      - name: Start and wait for Android APK on EAS
        run: npx eas-cli@latest build --platform android --profile apk --non-interactive --wait
