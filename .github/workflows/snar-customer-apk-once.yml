name: SNAR Customer APK - manual only

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Exact approved Customer commit SHA"
        required: true
        default: "cb15b514f888e3d9ca09cf46524d567d56d2c8b7"
        type: string
      confirmation:
        description: "Type BUILD_ONE_CUSTOMER_APK exactly"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: snar-customer-apk-manual
  cancel-in-progress: false

jobs:
  guard:
    name: Confirm one Customer APK
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require explicit authorization
        shell: bash
        run: |
          if [ "${{ inputs.confirmation }}" != "BUILD_ONE_CUSTOMER_APK" ]; then
            echo "Build blocked: confirmation text is not exact."
            exit 1
          fi

  customer-apk:
    name: Build one SNAR Customer EAS APK
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: frontend
    env:
      CI: '1'
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_BACKEND_URL: https://api.kjappapp.no
      EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN: ${{ vars.MAPBOX_PUBLIC_TOKEN }}
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Checkout exact approved Customer source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
      - name: Verify exact source SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require Expo token
        shell: bash
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "Missing GitHub secret EXPO_TOKEN"
            exit 1
          fi
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Expo config check
        run: npx expo config --type public
      - name: Start and wait for Android APK on EAS
        run: npx eas-cli@latest build --platform android --profile apk --non-interactive --wait
