name: SNAR Driver APK

on:
  push:
    branches: [audit/driver-snar-p0-20261005]
    paths: [.github/workflows/driver-snar-apk.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snar-driver-apk
  cancel-in-progress: false

jobs:
  driver-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: driver-app
    env:
      CI: '1'
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_BACKEND_URL: https://api.kjappapp.no
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require existing Expo credentials
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "Missing GitHub secret EXPO_TOKEN"
            exit 1
          fi
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx expo config --type public
      - run: npx eas-cli@latest build --platform android --profile apk --non-interactive --wait
