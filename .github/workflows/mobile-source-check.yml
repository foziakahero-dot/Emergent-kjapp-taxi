name: KJAPP Mobile Source Check

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'driver-app/**'
      - '.github/workflows/mobile-source-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kjapp-mobile-source-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-syntax:
    name: Backend Python syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile backend
        run: python -m compileall -q backend

  customer-source:
    name: Customer TypeScript + Expo config
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Resolve Expo config
        run: npx expo config --type public

  driver-source:
    name: Driver TypeScript + Expo config
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: driver-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Resolve Expo config
        run: npx expo config --type public
