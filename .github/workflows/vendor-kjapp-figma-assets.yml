name: Vendor KJAPP Figma assets

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  vendor-assets:
    if: ${{ !contains(github.event.head_commit.message, 'vendor KJAPP Figma assets') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip when assets are already vendored
        id: check
        run: |
          if [ -f marketing-web/public/figma-assets/.vendored ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Download exact Figma assets
        if: steps.check.outputs.ready != 'true'
        run: |
          set -euo pipefail
          mkdir -p marketing-web/public/figma-assets
          curl -L --fail 'https://www.figma.com/api/mcp/asset/6c5a157b-7016-42d7-930a-4897eefe7fc8.svg' -o marketing-web/public/figma-assets/logo.svg
          curl -L --fail 'https://www.figma.com/api/mcp/asset/3e50c9aa-7707-4fba-8d16-3eb0cc67fdbc.svg' -o marketing-web/public/figma-assets/chevron.svg
          curl -L --fail 'https://www.figma.com/api/mcp/asset/9361a9c9-4ad7-4534-a054-0e13e2a9593b.svg' -o marketing-web/public/figma-assets/shield-check.svg
          curl -L --fail 'https://www.figma.com/api/mcp/asset/70e373f4-90b1-4c5d-aa38-f3ec563e64b2.svg' -o marketing-web/public/figma-assets/search.svg
          curl -L --fail 'https://www.figma.com/api/mcp/asset/6ce6f108-7880-421b-9f25-f2282d18bf4d.svg' -o marketing-web/public/figma-assets/check.svg
          curl -L --fail 'https://www.figma.com/api/mcp/asset/1949801c-6dca-46d4-a3cd-fc922e79af65.svg' -o marketing-web/public/figma-assets/mic.svg
          curl -L --fail 'https://www.figma.com/api/mcp/asset/595b0f98-ab59-471f-b08a-a2ac3b5bc41a.svg' -o marketing-web/public/figma-assets/mic-small.svg
          curl -L --fail 'https://www.figma.com/api/mcp/asset/b5ea90e6-0dfa-49bf-bc0c-f1bcd1dac8d5.svg' -o marketing-web/public/figma-assets/shield.svg
          curl -L --fail 'https://www.figma.com/api/mcp/asset/e3256b6f-43d5-4c58-a69b-02459f6f3288.svg' -o marketing-web/public/figma-assets/plus.svg
          curl -L --fail 'https://www.figma.com/api/mcp/asset/7463016a-0bab-414c-97b8-3a0b58480bee.png' -o marketing-web/public/figma-assets/hero-map.png
          curl -L --fail 'https://www.figma.com/api/mcp/asset/05016276-a2c1-4301-ab46-e0675a329ab0.png' -o marketing-web/public/figma-assets/role-passenger.png
          curl -L --fail 'https://www.figma.com/api/mcp/asset/678d6352-5ad3-42ea-be06-08c5c003086d.png' -o marketing-web/public/figma-assets/role-driver.png
          curl -L --fail 'https://www.figma.com/api/mcp/asset/fe2a62b0-6a72-47a3-9aaa-f9b83d073acc.png' -o marketing-web/public/figma-assets/role-fleet.png
          curl -L --fail 'https://www.figma.com/api/mcp/asset/3fc4f31c-dd59-43e8-b030-d37a698e0db1.png' -o marketing-web/public/figma-assets/flow-1.png
          curl -L --fail 'https://www.figma.com/api/mcp/asset/fc8fb513-cd58-47d9-bab2-3f3da4d3cfaf.png' -o marketing-web/public/figma-assets/flow-2.png
          curl -L --fail 'https://www.figma.com/api/mcp/asset/061a13b1-17ef-4c4f-b30c-105cdad8963e.png' -o marketing-web/public/figma-assets/flow-3.png
          curl -L --fail 'https://www.figma.com/api/mcp/asset/1ad06903-72bd-4da5-b95c-8d3253d45a94.png' -o marketing-web/public/figma-assets/flow-4.png
          curl -L --fail 'https://www.figma.com/api/mcp/asset/65d177ca-a5cf-432e-833a-594be0c51743.png' -o marketing-web/public/figma-assets/vehicle-standard.png
          curl -L --fail 'https://www.figma.com/api/mcp/asset/6791996e-0d54-4d6a-bcaa-d443e9e3f4fd.png' -o marketing-web/public/figma-assets/vehicle-xl.png
          curl -L --fail 'https://www.figma.com/api/mcp/asset/7ce9de16-f717-4fba-94d6-960830d175ed.png' -o marketing-web/public/figma-assets/vehicle-premium.png
          touch marketing-web/public/figma-assets/.vendored
      - name: Point landing page at local assets
        if: steps.check.outputs.ready != 'true'
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('marketing-web/src/PremiumHome.tsx')
          s = p.read_text()
          replacements = {
            'https://www.figma.com/api/mcp/asset/6c5a157b-7016-42d7-930a-4897eefe7fc8.svg':'/figma-assets/logo.svg',
            'https://www.figma.com/api/mcp/asset/3e50c9aa-7707-4fba-8d16-3eb0cc67fdbc.svg':'/figma-assets/chevron.svg',
            'https://www.figma.com/api/mcp/asset/9361a9c9-4ad7-4534-a054-0e13e2a9593b.svg':'/figma-assets/shield-check.svg',
            'https://www.figma.com/api/mcp/asset/70e373f4-90b1-4c5d-aa38-f3ec563e64b2.svg':'/figma-assets/search.svg',
            'https://www.figma.com/api/mcp/asset/6ce6f108-7880-421b-9f25-f2282d18bf4d.svg':'/figma-assets/check.svg',
            'https://www.figma.com/api/mcp/asset/1949801c-6dca-46d4-a3cd-fc922e79af65.svg':'/figma-assets/mic.svg',
            'https://www.figma.com/api/mcp/asset/595b0f98-ab59-471f-b08a-a2ac3b5bc41a.svg':'/figma-assets/mic-small.svg',
            'https://www.figma.com/api/mcp/asset/b5ea90e6-0dfa-49bf-bc0c-f1bcd1dac8d5.svg':'/figma-assets/shield.svg',
            'https://www.figma.com/api/mcp/asset/e3256b6f-43d5-4c58-a69b-02459f6f3288.svg':'/figma-assets/plus.svg',
            'https://www.figma.com/api/mcp/asset/7463016a-0bab-414c-97b8-3a0b58480bee.png':'/figma-assets/hero-map.png',
            'https://www.figma.com/api/mcp/asset/05016276-a2c1-4301-ab46-e0675a329ab0.png':'/figma-assets/role-passenger.png',
            'https://www.figma.com/api/mcp/asset/678d6352-5ad3-42ea-be06-08c5c003086d.png':'/figma-assets/role-driver.png',
            'https://www.figma.com/api/mcp/asset/fe2a62b0-6a72-47a3-9aaa-f9b83d073acc.png':'/figma-assets/role-fleet.png',
            'https://www.figma.com/api/mcp/asset/3fc4f31c-dd59-43e8-b030-d37a698e0db1.png':'/figma-assets/flow-1.png',
            'https://www.figma.com/api/mcp/asset/fc8fb513-cd58-47d9-bab2-3f3da4d3cfaf.png':'/figma-assets/flow-2.png',
            'https://www.figma.com/api/mcp/asset/061a13b1-17ef-4c4f-b30c-105cdad8963e.png':'/figma-assets/flow-3.png',
            'https://www.figma.com/api/mcp/asset/1ad06903-72bd-4da5-b95c-8d3253d45a94.png':'/figma-assets/flow-4.png',
            'https://www.figma.com/api/mcp/asset/65d177ca-a5cf-432e-833a-594be0c51743.png':'/figma-assets/vehicle-standard.png',
            'https://www.figma.com/api/mcp/asset/6791996e-0d54-4d6a-bcaa-d443e9e3f4fd.png':'/figma-assets/vehicle-xl.png',
            'https://www.figma.com/api/mcp/asset/7ce9de16-f717-4fba-94d6-960830d175ed.png':'/figma-assets/vehicle-premium.png',
          }
          for src, dst in replacements.items(): s = s.replace(src, dst)
          p.write_text(s)
          PY
      - name: Commit vendored assets
        if: steps.check.outputs.ready != 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add marketing-web/public/figma-assets marketing-web/src/PremiumHome.tsx
          git commit -m 'chore: vendor KJAPP Figma assets'
          git push
