name: Apply Customer Search Collapse

on:
  push:
    branches:
      - fix/customer-search-mapbox-stripe-20261004
    paths:
      - 'patches/customer-search-collapse.patch'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/customer-search-mapbox-stripe-20261004
          fetch-depth: 0

      - name: Apply focused search-collapse patch
        shell: bash
        run: |
          set -euo pipefail
          PATCH='patches/customer-search-collapse.patch'
          if [ ! -f "$PATCH" ]; then
            echo 'Patch already consumed.'
            exit 0
          fi
          git apply --check "$PATCH"
          git apply "$PATCH"
          git rm "$PATCH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'frontend/app/(app)/home.tsx'
          git commit -m 'fix(customer): make destination search collapsible'
          git push origin HEAD:fix/customer-search-mapbox-stripe-20261004
